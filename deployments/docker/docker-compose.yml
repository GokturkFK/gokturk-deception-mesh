name: gokturk-deception-mesh

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gokturk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gokturk}
      POSTGRES_DB: ${POSTGRES_DB:-gokturk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gokturk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-api:
    build:
      context: ../../
      dockerfile: deployments/docker/control-api.Dockerfile
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-gokturk}:${POSTGRES_PASSWORD:-gokturk}@postgres:5432/${POSTGRES_DB:-gokturk}?sslmode=disable
      NATS_URL: nats://nats:4222
      HMAC_KEY: ${HMAC_KEY:?HMAC_KEY .env dosyasinda tanimlanmali}
      HTTP_ADDR: ":8080"
      # APP-3 auth: POST /api/v1/traps (provision) operator token'ina kilitli.
      # Bos birakilirsa auth devre disi kalir (air-gapped/gelistirme). Okumalar
      # (GET traps/alerts) her durumda aciktir; sensor/dashboard degismez.
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      READONLY_TOKEN: ${READONLY_TOKEN:-}
      # APP-8 bildirim fan-out: siem-sink demo icin varsayilan olarak acik,
      # Telegram/webhook opsiyoneldir (.env'de bos birakilirsa devre disi kalir).
      SIEM_SYSLOG_ADDR: siem-sink:514
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      siem-sink:
        condition: service_started
    healthcheck:
      # distroless image'da wget yok; binary'nin healthcheck alt komutu kullaniliyor.
      test: ["CMD", "/control-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # auth.log mount'u Debian/Ubuntu varsayar (journald tabanli dagitimlarda
  # /var/log/auth.log olmayabilir); demo bu formatta uretilen bir log bekler.
  sensor-ssh:
    build:
      context: ../../
      dockerfile: deployments/docker/sensor-ssh.Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      AUTH_LOG_PATH: /var/log/auth.log
      # APP-5: sensor, canary kullanici -> trap_id eslemesini buradan ceker.
      CONTROL_API_URL: http://control-api:8080
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
    depends_on:
      nats:
        condition: service_healthy
      control-api:
        condition: service_healthy

  # Streamlit GÖKTÜRK paneli (APP-9): control-api'nin GET /api/v1/alerts
  # ucunu periyodik ceker, kod dashboard/ altindadir.
  dashboard:
    build:
      context: ../../
      dockerfile: deployments/docker/dashboard.Dockerfile
    environment:
      CONTROL_API_URL: http://control-api:8080
      # GKO-4 coklu kaynak: panel birden fazla urunun alarmini ayni feed'de
      # gosterebiliyor ama compose bu degeri HIC gecirmiyordu — ucuncu bir
      # urunu (GOKZINCIR) beslemek icin compose dosyasini elle duzenlemek
      # gerekiyordu. Bos birakilirsa davranis degismez: yalnizca
      # CONTROL_API_URL kullanilir.
      #   ALERT_SOURCES="GOKTURK=http://control-api:8080,GOKZINCIR=http://host.docker.internal:8100"
      ALERT_SOURCES: ${ALERT_SOURCES:-}
    ports:
      - "8501:8501"
    extra_hosts:
      # Panel konteynerinden host'ta ayri ayaga kalkan urunlere (GOKKALKAN
      # 8090, GOKZINCIR 8100) erisebilmek icin. Linux'ta bu ad varsayilan
      # olarak cozulmez; Docker Desktop'ta zaten var, tekrar tanimlamak
      # zararsiz.
      - "host.docker.internal:host-gateway"
    depends_on:
      control-api:
        condition: service_healthy

  # Demo SIEM alıcısı — alarmların syslog CEF olarak gerçekten dışarı çıktığını
  # göstermek için (bkz. PROJECT PLAN.md APP-8 AC). docker compose logs siem-sink
  # ile gelen CEF mesajları izlenebilir. socat imaja BUILD ZAMANINDA gömülür
  # (bkz. siem-sink.Dockerfile) — air-gapped kurulumda (OPS-7) çalışma zamanında
  # paket kurmaya çalışmak internet gerektirirdi.
  siem-sink:
    build:
      context: ../../
      dockerfile: deployments/docker/siem-sink.Dockerfile
    ports:
      - "514:514/udp"

volumes:
  pgdata:
